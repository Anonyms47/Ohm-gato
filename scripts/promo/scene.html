<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Jost"; src: url("__JOST__") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #fff; }

  /* ---------- conversation (style messagerie) ---------- */
  #chat { position: absolute; left: 50%; width: 1040px; margin-left: -520px; top: 40px; bottom: 50px;
    display: flex; flex-direction: column; justify-content: flex-start; overflow: hidden;
    font-family: "Inter", "Noto Color Emoji", sans-serif; }
  .row { display: flex; flex-direction: column; overflow: visible; flex: none; }
  .row.r { align-items: flex-end; }
  .row.l { align-items: flex-start; }
  .b { position: relative; max-width: 780px; flex: none; padding: 15px 24px 16px; border-radius: 30px; font-size: 36px; line-height: 1.28;
    letter-spacing: -0.2px; white-space: pre-wrap; transform-origin: bottom right; }
  .row.l .b { transform-origin: bottom left; }
  .row.r .b { background: #1f8bff; color: #fff; }
  .row.l .b { background: #e9e9eb; color: #000; }
  .b .txt { display: block; }
  .b.link .txt { text-decoration: underline; text-underline-offset: 5px; }
  /* queue de bulle (dernier message d'une série) */
  .b.tail::before, .b.tail::after { content: ""; position: absolute; bottom: 0; height: 30px; }
  .row.r .b.tail::before { right: -9px; width: 24px; background: #1f8bff; border-bottom-left-radius: 18px 16px; }
  .row.r .b.tail::after { right: -30px; width: 30px; background: #fff; border-bottom-left-radius: 14px; }
  .row.l .b.tail::before { left: -9px; width: 24px; background: #e9e9eb; border-bottom-right-radius: 18px 16px; }
  .row.l .b.tail::after { left: -30px; width: 30px; background: #fff; border-bottom-right-radius: 14px; }
  .dots { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 9px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; background: #8e8e93; display: block; }
  .meta { font-size: 22px; color: #8e8e93; margin-top: 6px; margin-right: 6px; }

  /* ---------- scènes de marque ---------- */
  #morph { position: absolute; background: #1f8bff; }
  #brand { position: absolute; inset: 0; }
  #brand svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .card { position: absolute; overflow: hidden; background: #fbf4ea; }
  .card img { position: absolute; object-fit: cover; }
  .card .t { position: absolute; font-family: "Jost", sans-serif; color: #3a2418; }
  .card .name { font-size: 72px; font-weight: 600; line-height: 1.05; }
  .card .desc { font-size: 38px; font-weight: 400; line-height: 1.3; color: #5b4031; }
  .cell .name { font-size: 30px; font-weight: 600; }
  #pill { position: absolute; display: flex; align-items: center; justify-content: center; font-family: "Jost", sans-serif;
    font-weight: 600; font-size: 44px; color: #f5e9d6; white-space: nowrap; overflow: hidden; }
  #tagline { position: absolute; left: 0; width: 1920px; text-align: center; font-family: "Jost", sans-serif; font-size: 50px;
    color: #3a2418; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="chat"></div>
  <div id="brand">
    <svg viewBox="0 0 1920 1080">
      <g id="symG"><path id="body" fill="#3A2418" /><path id="dia" fill="#DCA7AE" /></g>
    </svg>
  </div>
  <div id="cards"></div>
  <div id="tagline"></div>
  <div id="pill"></div>
  <div id="morph"></div>
</div>
</body>
</html>
