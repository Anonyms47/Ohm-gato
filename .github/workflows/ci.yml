name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications de base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier le respect de .editorconfig
        uses: editorconfig-checker/action-editorconfig-checker@v2

      - run: editorconfig-checker

  qualite:
    name: Lint, typage, tests unitaires, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  base-et-parcours:
    name: Base de données et parcours Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Démarrer Supabase local
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,postgres-meta
      - name: Tests de la base (pgTAP)
        run: npx supabase test db
      - name: Préparer .env.local (valeurs locales de test uniquement)
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "APP_ENV=test"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "TRACKING_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "PAYMENT_TEST_MODE=true"
            echo "PAYMENT_TEST_WEBHOOK_SECRET=$(openssl rand -hex 32)"
          } > .env.local
      - run: npx playwright install --with-deps chromium
      - name: Parcours critiques
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
